name: Fuzz
on:
  schedule:
    - cron: "41 3 * * 0" # weekly
  workflow_dispatch:
    inputs:
      fuzztime:
        description: Time per target
        default: 5m

permissions:
  contents: read

jobs:
  fuzz:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { package: ., target: FuzzParseWireValue }
          - { package: ., target: FuzzVaultOpen }
          - { package: ./aes, target: FuzzDecrypt }
          - { package: ./aes, target: FuzzDecryptStream }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable

      - name: Fuzz
        env:
          PKG: ${{ matrix.package }}
          TARGET: ${{ matrix.target }}
          FUZZTIME: ${{ inputs.fuzztime || '5m' }}
        run: go test -run='^$' -fuzz="^${TARGET}\$" -fuzztime="$FUZZTIME" "$PKG"

      - name: Keep the failing input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}-crasher
          path: '**/testdata/fuzz/${{ matrix.target }}/'
